app = 'ma9ictv'
primary_region = 'ams'

[build]
  dockerfile = "Dockerfile"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[http_service.checks]]
  method = "GET"
  path = "/api/health"
  interval = "15s"
  timeout = "3s"
  grace_period = "15s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
