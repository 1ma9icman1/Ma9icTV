services:
  - type: web
    name: ma9ictv-web
    runtime: node
    plan: free
    region: ohio
    branch: main
    buildCommand: npm install --legacy-peer-deps && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22.22.0"
      - key: NODE_ENV
        value: production
